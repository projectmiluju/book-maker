<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Maker Write</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">Book Maker</div>
        <nav class="nav">
          <a href="./archive.html">Archive</a>
          <a href="./draft-builder.html">Drafts</a>
          <a href="./write.html" class="active">Write</a>
        </nav>
        <button class="cta">Done</button>
      </div>
    </header>

    <main class="container">
      <section class="editor">
        <div class="mini-meta">Private Entry · Autosaved 1 minute ago</div>
        <input class="editor-title" value="Untitled Entry" />
        <textarea class="editor-body" rows="12">Begin your thoughts here. This screen is intentionally quiet. There is no formatting toolbar, no heavy controls, and no pressure to write a finished chapter. Only enough structure to let a short piece begin, settle, and stay.</textarea>
        <div class="editor-meta">
          <span>128 words</span>
          <span>Saving is automatic</span>
        </div>
      </section>
    </main>
  </body>
</html>
