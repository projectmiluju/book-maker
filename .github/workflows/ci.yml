name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: book_maker
      POSTGRES_USER: book_maker
      POSTGRES_PASSWORD: book_maker
      API_PORT: 4100
      NUXT_PORT: 3100
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      AUTH_ACCESS_TOKEN_SECRET: book-maker-access-secret
      AUTH_ACCESS_TOKEN_EXPIRES_IN: 15m
      AUTH_REFRESH_TOKEN_SECRET: book-maker-refresh-secret
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 14d
      AUTH_REFRESH_SESSION_PREFIX: auth:refresh
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: book_maker
          POSTGRES_USER: book_maker
          POSTGRES_PASSWORD: book_maker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U book_maker -d book_maker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web
        run: pnpm build:web

      - name: Build api
        run: pnpm build:api

      - name: API e2e test
        run: pnpm test:api:e2e

      - name: Install Playwright browser
        run: pnpm --filter @book-maker/web exec playwright install --with-deps chromium

      - name: Web smoke e2e test
        run: pnpm test:web:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
